name: CI/CD

# main 에 push 되면 이미지 빌드 → GHCR 푸시 → 서버 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # lhoju0158/q-asker-db-consumer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Dockerfile 멀티스테이지에서 ./gradlew bootJar -x test 로 빌드
      # (통합 테스트는 DB/Kafka 가 필요해 CI 에서 스킵)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # application.yml(민감정보 포함)은 git 미추적 → Secret 에 보관하고 배포 때 주입
      - name: Render application.yml from secret
        run: |
          mkdir -p deploy
          printf '%s' "$APPLICATION_YML" > deploy/application.yml
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}

      # 서버의 /opt/db-consumer/application.yml 로 업로드 (docker run 이 이 파일을 마운트)
      - name: Upload application.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }} # 미설정 시 22
          source: deploy/application.yml
          target: /opt/db-consumer
          strip_components: 1 # deploy/ 제거 → /opt/db-consumer/application.yml
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }} # 미설정 시 22
          envs: REGISTRY,IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop db-consumer || true
            docker rm db-consumer || true
            # application.yml 은 Secret 에서 주입된 /opt/db-consumer/application.yml 를 마운트
            docker run -d \
              --name db-consumer \
              --restart unless-stopped \
              -v /opt/db-consumer/application.yml:/app/config/application.yml:ro \
              "$IMAGE"
            docker image prune -f
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
